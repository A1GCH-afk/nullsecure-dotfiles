add_newline = false
format = """$directory[ › ](#4c566a)[@@PROMPT_LABEL@@](bold #bf616a)[ › ](#4c566a)${custom.vpn}${custom.sessions}$line_break$character"""

[directory]
style = "bold #88c0d0"
format = "[$path]($style)"
truncation_length = 2
truncate_to_repo = true

[custom.vpn]
disabled = true
command = "ip -4 addr show tun0 2>/dev/null | grep -oP '(?<=inet\\s)\\d+(\\.\\d+){3}'"
when = "ip link show tun0 >/dev/null 2>&1"
style = "bold #ebcb8b"
format = "[$output]($style)"

[custom.sessions]
command = "pgrep -c msfconsole 2>/dev/null"
when = "test $(pgrep -c msfconsole 2>/dev/null || echo 0) -gt 0"
style = "bold #a3be8c"
format = " [⚡ $output sessions]($style)"

[character]
success_symbol = "[❯](bold #a3be8c)"
error_symbol = "[❯](bold #bf616a)"
